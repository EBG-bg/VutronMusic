apply plugin: 'com.android.application'

// Keep the proven Android runtime and match/quality rules in one source tree.
// Only the platform classes below are shared; the legacy activity and playback
// service are deliberately outside this generated source root.
def legacyAndroidMain = file('../../../../vendor/android-runtime/src/main')
def reusedRuntimeSources = layout.buildDirectory.dir('generated/vutron-runtime/java')
def syncVutronRuntimeSources = tasks.register('syncVutronRuntimeSources', Sync) {
    from(new File(legacyAndroidMain, 'java')) {
        include '**/EmbeddedSources.java', '**/SourceSettings.java',
                '**/LocalTrackMatcher.java', '**/PlaybackQuality.java', '**/ArtworkSource.java'
    }
    into(reusedRuntimeSources)
}
def publicLegalAssets = layout.buildDirectory.dir('generated/mobile-legal-assets')
def syncMobileLegal = tasks.register('syncMobileLegal', Sync) {
    into(publicLegalAssets)
    into('legal') {
        from(file('../../../../legal'))
        from(file('../../../..')) { include 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md' }
    }
}
def releaseStore = System.getenv('VUTRON_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('VUTRON_RELEASE_STORE_PASSWORD')
def releaseAlias = System.getenv('VUTRON_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('VUTRON_RELEASE_KEY_PASSWORD')

android {
    namespace "io.github.vutronmusic.personal"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.vutronmusic.personal.webshell"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk { abiFilters 'arm64-v8a' }
        versionCode 15
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStore) {
            mobileRelease {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword ?: releaseStorePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.mobileRelease
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Reuse the NetEase transport and encrypted session store from the
    // existing native Android implementation.  Keep this inside the Android
    // extension so AGP registers the additional source root for every variant.
    sourceSets {
        main.java.srcDirs += [file('../../../../android/shared/src/main/java')]
        main.java.srcDir(reusedRuntimeSources)
        main.assets.srcDir(new File(legacyAndroidMain, 'assets'))
        main.assets.exclude 'NOTICE.txt'
        main.assets.srcDir(publicLegalAssets)
        main.jniLibs.srcDir(new File(legacyAndroidMain, 'jniLibs'))
    }
    packaging {
        // EmbeddedSources loads libnode through nativeLibraryDir via JNA.
        // Extraction must therefore remain enabled on Android 13.
        jniLibs { useLegacyPackaging = true }
    }
}

tasks.named('preBuild').configure { dependsOn(syncVutronRuntimeSources, syncMobileLegal) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
