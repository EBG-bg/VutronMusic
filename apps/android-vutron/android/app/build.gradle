apply plugin: 'com.android.application'

def identityFile = file('../../dist/build-info.json')
if (!identityFile.isFile()) throw new GradleException('Build the web app with scripts/build-mobile first; build identity is required.')
def identity = new groovy.json.JsonSlurper().parseText(identityFile.getText('UTF-8'))
def privateIdentityFile = file('../../_private/build-personal.json')
def edition = project.findProperty('vutronEdition') ?: System.getenv('VUTRON_BUILD_EDITION') ?: 'auto'
if (edition == 'auto') edition = privateIdentityFile.isFile() ? 'personal' : 'mobile'
if (!(edition in ['personal', 'mobile']) || identity.edition != edition) throw new GradleException('Edition differs from the web bundle. Rebuild both through scripts/build-mobile.')
def publicVersion = new groovy.json.JsonSlurper().parseText(file('../../package.json').getText('UTF-8')).version
def publicIdentity = new groovy.json.JsonSlurper().parseText(file('../../mobile-release.json').getText('UTF-8'))
if (edition == 'personal') {
    if (!privateIdentityFile.isFile()) throw new GradleException('Private build configuration is required.')
    def expected = new groovy.json.JsonSlurper().parseText(privateIdentityFile.getText('UTF-8'))
    if (!(identity.version ==~ /0\.3\.\d+/) || identity.displayName != expected.requiredDisplayName || identity.version != expected.version || identity.versionCode != expected.versionCode)
        throw new GradleException('Personal build identity violates its private version/branding rules.')
} else if (!(identity.version ==~ /1\.\d+\.\d+/) || identity.displayName != 'Vutron Music - Mobile' || identity.version != publicVersion || identity.versionCode != publicIdentity.versionCode) {
    throw new GradleException('Official builds require the official name and 1.x version series.')
}
if (identity.comparisonVersion != publicVersion) throw new GradleException('Update baseline differs from the current official feature version.')

// Keep the proven Android runtime and match/quality rules in one source tree.
// Only the platform classes below are shared; the legacy activity and playback
// service are deliberately outside this generated source root.
def legacyAndroidMain = file('../../../../vendor/android-runtime/src/main')
def reusedRuntimeSources = layout.buildDirectory.dir('generated/vutron-runtime/java')
def syncVutronRuntimeSources = tasks.register('syncVutronRuntimeSources', Sync) {
    from(new File(legacyAndroidMain, 'java')) {
        include '**/EmbeddedSources.java', '**/SourceSettings.java',
                '**/LocalTrackMatcher.java', '**/PlaybackQuality.java', '**/ArtworkSource.java'
    }
    into(reusedRuntimeSources)
}
def publicLegalAssets = layout.buildDirectory.dir('generated/mobile-legal-assets')
def syncMobileLegal = tasks.register('syncMobileLegal', Sync) {
    into(publicLegalAssets)
    into('legal') {
        from(file('../../../../legal'))
        from(file('../../../..')) { include 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md' }
    }
}
def releaseStore = System.getenv('VUTRON_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('VUTRON_RELEASE_STORE_PASSWORD')
def releaseAlias = System.getenv('VUTRON_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('VUTRON_RELEASE_KEY_PASSWORD')

android {
    buildFeatures { buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    namespace "io.github.vutronmusic.personal"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.vutronmusic.personal.webshell"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk { abiFilters 'arm64-v8a' }
        versionCode identity.versionCode as int
        versionName identity.version as String
        resValue 'string', 'app_name', identity.displayName
        resValue 'string', 'title_activity_main', identity.displayName
        buildConfigField 'String', 'APP_DISPLAY_NAME', groovy.json.JsonOutput.toJson(identity.displayName)
        buildConfigField 'String', 'APP_EDITION', groovy.json.JsonOutput.toJson(identity.edition)
        buildConfigField 'String', 'UPDATE_COMPARISON_VERSION', groovy.json.JsonOutput.toJson(identity.comparisonVersion)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStore) {
            mobileRelease {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword ?: releaseStorePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.mobileRelease
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Reuse the NetEase transport and encrypted session store from the
    // existing native Android implementation.  Keep this inside the Android
    // extension so AGP registers the additional source root for every variant.
    sourceSets {
        main.java.srcDirs += [file('../../../../android/shared/src/main/java')]
        main.java.srcDir(reusedRuntimeSources)
        main.assets.srcDir(new File(legacyAndroidMain, 'assets'))
        main.assets.exclude 'NOTICE.txt'
        main.assets.srcDir(publicLegalAssets)
        main.jniLibs.srcDir(new File(legacyAndroidMain, 'jniLibs'))
    }
    packaging {
        // EmbeddedSources loads libnode through nativeLibraryDir via JNA.
        // Extraction must therefore remain enabled on Android 13.
        jniLibs { useLegacyPackaging = true }
    }
}

tasks.named('preBuild').configure { dependsOn(syncVutronRuntimeSources, syncMobileLegal) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
